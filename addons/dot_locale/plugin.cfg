[plugin]

name="dot-locale"
description="Localisation that reads the website's own locale files: one JSON per namespace per language, ICU MessageFormat with CLDR plural rules for the nine languages the site ships, a fallback chain that ends in a searchable key rather than an empty label, refusal keys rendered in the player's language, and pseudo-localisation that finds hard-coded strings and truncated labels before a translation is paid for. Depends only on dot-core."
author="dot"
version="0.1.0"
script="dot_locale_plugin.gd"
